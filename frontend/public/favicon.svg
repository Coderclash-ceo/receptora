<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Headset band -->
  <path d="M 28 54 A 36 36 0 0 1 92 54" fill="none" stroke="url(#favBlue)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Left earpiece -->
  <rect x="20" y="44" width="8" height="20" rx="4" fill="url(#favBlue)" />
  
  <!-- Right earpiece -->
  <rect x="92" y="44" width="8" height="20" rx="4" fill="url(#favBlue)" />

  <!-- Mic boom -->
  <path d="M 24 62 C 23 80, 38 90, 56 89" fill="none" stroke="url(#favBlue)" stroke-width="5" stroke-linecap="round" />
  <rect x="52" y="85" width="13" height="8" rx="4" fill="url(#favBlue)" />

  <!-- Chat bubble head -->
  <path d="M 60 28 C 78 28, 90 39, 90 53 C 90 66, 80 77, 63 77 C 60 77, 48 77, 43 76 C 33 74, 30 65, 30 53 C 30 39, 42 28, 60 28 Z" fill="url(#favBlue)" />
  
  <!-- Tail -->
  <path d="M 80 72 L 86 82 C 86.5 83, 85 84, 83.5 82.5 L 74 76 Z" fill="url(#favBlue)" />

  <!-- Eyes and smile -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
  <path d="M 69 51 Q 74 46 78 51" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
  <path d="M 52 59 Q 62 70 72 59" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
</svg>

